[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyayagraph"
version = "0.1.0"
description = "NGT Order Scraper & Legal Case Knowledge Graph Manager"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.0",
    "pdfplumber>=0.11.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
]

[project.scripts]
nyayagraph = "cli:main"

[tool.setuptools.packages.find]
include = ["nyayagraph*"]
